<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="3D Scene Understanding research explorer from PNU CVLab.">
  <script src="/assets/js/theme.js"></script>
  <title>3D Scene Understanding Explorer · PNU CVLab</title>
  <style>
    :root {
      --accent: #40a8bf;
      --accent-dark: #287f93;
      --ink: #17191c;
      --muted: #66707a;
      --line: #dfe5e8;
      --soft: #f5f8f9;
      --dark: #111820;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
    }
    .topbar {
      border-bottom: 1px solid #2d3a44;
      background: var(--dark);
      color: #fff;
    }
    .topbar-inner {
      display: flex;
      width: min(1160px, calc(100% - 32px));
      min-height: 64px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin: 0 auto;
    }
    .brand { font-size: 18px; font-weight: 900; }
    .back-link {
      color: #dff5f9;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .shell {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 64px 0 80px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      background: var(--accent);
    }
    h1 {
      max-width: 850px;
      margin: 14px 0 16px;
      font-size: clamp(38px, 6vw, 72px);
      line-height: 1;
      letter-spacing: -.045em;
    }
    .lead {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.65;
    }
    .empty-state {
      position: relative;
      min-height: 360px;
      margin-top: 38px;
      padding: 38px;
      border: 1px solid var(--line);
      background:
        linear-gradient(rgba(64, 168, 191, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(64, 168, 191, .08) 1px, transparent 1px),
        linear-gradient(145deg, #f7fbfc, #e7f4f7);
      background-size: 34px 34px, 34px 34px, auto;
    }
    .empty-state::before,
    .empty-state::after {
      content: "";
      position: absolute;
      border: 2px solid rgba(40, 127, 147, .32);
    }
    .empty-state::before { inset: 22% 17%; }
    .empty-state::after {
      top: 44%;
      left: 34%;
      width: 32%;
      height: 7px;
      border: 0;
      border-radius: 999px;
      background: var(--accent-dark);
      transform: rotate(-18deg);
    }
    .status {
      position: relative;
      z-index: 1;
      display: inline-flex;
      padding: 7px 10px;
      border: 1px solid #b9dfe7;
      border-radius: 999px;
      background: #edf9fb;
      color: var(--accent-dark);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .topbar-actions { display: flex; align-items: center; gap: 18px; }
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1px solid #3a4a56;
      border-radius: 50%;
      background: transparent;
      color: #dff5f9;
      cursor: pointer;
    }
    .theme-toggle:hover { background: #22303a; }
    .theme-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    html[data-theme="dark"] {
      --accent: #5cc0d6;
      --accent-dark: #7fd0e2;
      --ink: #e3e8eb;
      --muted: #9eabb4;
      --line: #2f3b45;
      --soft: #1a2128;
    }
    html[data-theme="dark"] body { background: #12171c; }
    html[data-theme="dark"] .empty-state {
      background:
        linear-gradient(rgba(92, 192, 214, .08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92, 192, 214, .08) 1px, transparent 1px),
        linear-gradient(145deg, #172227, #12303a);
      background-size: 34px 34px, 34px 34px, auto;
    }
    html[data-theme="dark"] .status { border-color: #2f6f7e; background: #15333b; color: #8fd7e6; }
    @media (max-width: 600px) {
      .shell { width: calc(100% - 22px); padding-top: 42px; }
      .topbar-inner { width: calc(100% - 22px); }
      .empty-state { min-height: 280px; padding: 24px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">PNU CVLab</div>
      <div class="topbar-actions">
        <a class="back-link" href="/research/#3d-recognition">← Back to Research</a>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to night mode"></button>
      </div>
    </div>
  </header>
  <main class="shell">
    <span class="eyebrow">Interactive Research Explorer</span>
    <h1>3D Scene Understanding</h1>
    <p class="lead">Detailed research content will be added here.</p>
    <div class="empty-state" aria-label="Explorer content coming soon">
      <span class="status">Coming soon</span>
    </div>
  </main>
</body>
</html>
